<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Mood Visualizer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Mood Visualizer</h1>
        <input type="text" id="userInput" placeholder="type something">

        <div id="moodText"></div>
        <div id="suggestionText"></div>

        <div id="canvas"></div>
    </div>

    <script>
        let canvas = document.getElementById('canvas');
        let moodText = document.getElementById('moodText');
        let suggestionText = document.getElementById('suggestionText');
        let input = document.getElementById('userInput');

        let count = 0;
        let playing = false;
        let mood = 'calm';

        let moods = {
            happy: { symbols: ['😊', '😄', '🙂', '😃'], speed: 0.2, color: '#ffd700' },
            sad: { symbols: ['😢', '😔', '😞', '☹️'], speed: 0.05, color: '#888' },
            angry: { symbols: ['😠', '😡', '💢', '😤'], speed: 0.3, color: '#ff4444' },
            calm: { symbols: ['😌', '😇', '🙏', '✨'], speed: 0.1, color: '#4299e1' }
        };

        let words = {
            happy: ['happy', 'joy', 'love', 'great', 'good', 'nice'],
            sad: ['sad', 'hurt', 'pain', 'cry', 'bad'],
            angry: ['angry', 'mad', 'hate', 'annoyed'],
            calm: ['calm', 'peace', 'quiet', 'chill']
        };

        // Added suggestions
        let suggestions = {
            happy: "You seem happy! Keep smiling and spreading positivity 😊",
            sad: "You seem sad. Try listening to music, going for a walk, or talking to a friend 💙",
            angry: "You seem angry. Take a deep breath and try relaxing for a few minutes 🧘",
            calm: "You seem calm. Enjoy the peaceful moment and keep relaxing ✨"
        };

        function findMood(text) {
            text = text.toLowerCase();
            
            for (let m in words) {
                for (let i = 0; i < words[m].length; i++) {
                    if (text.includes(words[m][i])) {
                        return m;
                    }
                }
            }
            return 'calm';
        }

        function draw() {
            let currentMood = moods[mood];
            let output = '';

            for (let y = 0; y < 10; y++) {
                for (let x = 0; x < 30; x++) {
                    let wave = Math.sin(x * 0.3 + count * currentMood.speed);
                    let pos = Math.floor((wave + 1) * 2) % currentMood.symbols.length;
                    output += currentMood.symbols[pos] + ' ';
                }
                output += '\n';
            }

            canvas.textContent = output;
            canvas.style.color = currentMood.color;

            count++;

            if (playing) {
                requestAnimationFrame(draw);
            }
        }

        input.addEventListener('input', function() {
            let text = input.value.trim();

            if (text) {
                mood = findMood(text);

                moodText.textContent = 'Mood: ' + mood;

                // Show suggestion
                suggestionText.textContent = suggestions[mood];

                if (!playing) {
                    playing = true;
                    count = 0;
                    draw();
                }
            } else {
                playing = false;
                canvas.textContent = '';
                moodText.textContent = '';
                suggestionText.textContent = '';
            }
        });

        playing = true;
        draw();
    </script>
</body>
</html>
